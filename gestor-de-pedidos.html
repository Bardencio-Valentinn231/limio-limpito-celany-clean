<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de pedidos | Cleany Clean</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg,#0b132b 0%,#1c2541 50%,#0a192f 100%); color:#f1f5f9; }
    .glass { background:rgba(15,23,42,.78); border:1px solid rgba(34,211,238,.25); backdrop-filter:blur(16px); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-5">
  <main class="glass w-full max-w-md rounded-3xl p-7 sm:p-9 shadow-2xl shadow-cyan-950/40">
    <a href="index.html" class="inline-flex items-center gap-2 text-sm text-cyan-300 hover:text-white mb-8">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Volver a Cleany Clean
    </a>
    <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-cyan-400/10 text-3xl text-cyan-300">
      <i class="fa-solid fa-clipboard-list" aria-hidden="true"></i>
    </div>
    <h1 class="text-center text-2xl sm:text-3xl font-extrabold text-white">Gestor de pedidos</h1>
    <p class="mt-2 mb-7 text-center text-sm text-slate-300">Ingresá la contraseña para continuar.</p>

    <form id="loginForm" class="space-y-4">
      <label for="password" class="block text-sm font-semibold text-slate-200">Contraseña</label>
      <div class="relative">
        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" aria-hidden="true"></i>
        <input id="password" name="password" type="password" autocomplete="current-password" required
          class="w-full rounded-xl border border-slate-700 bg-slate-950/80 py-3 pl-11 pr-4 text-white outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20"
          placeholder="Ingresá la contraseña">
      </div>
      <p id="loginError" class="hidden text-sm text-rose-300" role="alert">La contraseña no es correcta. Intentá de nuevo.</p>
      <button type="submit" class="w-full rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 px-5 py-3 font-bold text-white transition hover:brightness-110 focus:outline-none focus:ring-2 focus:ring-cyan-300">
        Entrar <i class="fa-solid fa-arrow-right ml-2" aria-hidden="true"></i>
      </button>
    </form>

    <section id="managerPlaceholder" class="hidden mt-6 rounded-2xl border border-cyan-400/20 bg-slate-950/50 p-5" aria-live="polite">
      <h2 class="text-lg font-bold text-cyan-200"><i class="fa-solid fa-circle-check mr-2" aria-hidden="true"></i>Acceso concedido</h2>
      <p class="mt-2 text-sm text-slate-300">El acceso está listo. En el próximo paso vamos a completar acá las funciones del gestor de pedidos.</p>
    </section>
    <p class="mt-7 text-center text-xs text-slate-500">Cleany Clean · Panel de pedidos</p>
  </main>

  <script>
    // Acceso temporal para el prototipo inicial. No es autenticación segura.
    const ACCESS_PASSWORD = "santi123";
    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const loginError = document.getElementById("loginError");
    const managerPlaceholder = document.getElementById("managerPlaceholder");

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();
      if (passwordInput.value === ACCESS_PASSWORD) {
        loginError.classList.add("hidden");
        loginForm.classList.add("hidden");
        managerPlaceholder.classList.remove("hidden");
      } else {
        loginError.classList.remove("hidden");
        passwordInput.focus();
        passwordInput.select();
      }
    });
  </script>
</body>
</html>
